simulation:
  # 仿真起始时间采用 ISO8601 格式（UTC 时间）
  startTime: "2025-01-01T04:00:00Z"
  # 仿真持续秒数，这里设为 3600 秒（即 1 小时）
  durationSeconds: 3600
  # 可见性计算参数
  # minElevationDeg: 0.0
  # coverageHalfAngleDeg: 45.0
  # maxInterSatDistanceMeters: 5000000.0


  # 卫星列表：2 个轨道，每个轨道有 3 颗卫星
  satellites:
    # 轨道 0 (raan = 0°)
    - semiMajorAxis: 6878140.0
      eccentricity: 0.0
      inclination: 90.0
      raan: 0.0
      argPerigee: 0.0
      trueAnomaly: 0.0
      epoch: "2025-01-01T04:00:00Z"
      direction: "prograde"
    - semiMajorAxis: 6878140.0
      eccentricity: 0.0
      inclination: 90.0
      raan: 0.0
      argPerigee: 0.0
      trueAnomaly: 120.0
      epoch: "2025-01-01T04:00:00Z"
      direction: "prograde"
    - semiMajorAxis: 6878140.0
      eccentricity: 0.0
      inclination: 90.0
      raan: 0.0
      argPerigee: 0.0
      trueAnomaly: 240.0
      epoch: "2025-01-01T04:00:00Z"
      direction: "prograde"

    # 轨道 1 (raan = 30°)
    - semiMajorAxis: 6878140.0
      eccentricity: 0.0
      inclination: 90.0
      raan: 30.0
      argPerigee: 0.0
      trueAnomaly: 0.0
      epoch: "2025-01-01T04:00:00Z"
      direction: "retrograde"
    - semiMajorAxis: 6878140.0
      eccentricity: 0.0
      inclination: 90.0
      raan: 30.0
      argPerigee: 0.0
      trueAnomaly: 240.0   # 轨道 1, 卫星 1: 基础角度 120.0, 逆行为 360 - 120.0 = 240.0
      epoch: "2025-01-01T04:00:00Z"
      direction: "retrograde"
    - semiMajorAxis: 6878140.0
      eccentricity: 0.0
      inclination: 90.0
      raan: 30.0
      argPerigee: 0.0
      trueAnomaly: 120.0 # 轨道 1, 卫星 2: 基础角度 240.0, 逆行为 360 - 240.0 = 120.0
      epoch: "2025-01-01T04:00:00Z"
      direction: "retrograde"


  # 地面站列表：共 2 个地面站
  groundStations:
    - lat: 0.0    # 纬度
      lon: 0.0    # 0° 经线
      alt: 0.0    # 海平面
    - lat: 0.0
      lon: 36.0
      alt: 0.0

